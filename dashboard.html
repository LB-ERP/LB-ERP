<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LB ERP · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-deep:#10151c;
    --bg-panel:#171d26;
    --bg-card:#1b222c;
    --line:#2b3542;
    --accent:#c98a3e;
    --accent-hover:#dea057;
    --accent-dim:#5a4126;
    --text-primary:#edeae3;
    --text-muted:#8b93a1;
    --error:#d97757;
    --ok:#7fae86;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    font-family:'Work Sans', sans-serif;
    color:var(--text-primary);
    background:var(--bg-deep);
  }
  a{ color:inherit; text-decoration:none; }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
    background:var(--bg-panel);
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:22px;
  }
  .brand span{ color:var(--accent); }

  .empresa-chip{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 14px;
  }
  .empresa-chip .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .empresa-chip .info{ line-height:1.3; }
  .empresa-chip .info .nombre{ font-weight:600; font-size:14px; }
  .empresa-chip .info .rol{ font-size:11.5px; color:var(--text-muted); text-transform:capitalize; }

  .session-actions{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:13px;
    color:var(--text-muted);
  }
  .logout-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-primary);
    padding:8px 14px;
    border-radius:3px;
    font-size:13px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    transition:border-color .15s ease;
  }
  .logout-btn:hover{ border-color:var(--accent); }

  /* ---------- main ---------- */
  main{
    max-width:1100px;
    margin:0 auto;
    padding:36px 32px 60px;
  }

  .section-title{
    font-family:'Oswald', sans-serif;
    font-size:14px;
    letter-spacing:1.5px;
    color:var(--text-muted);
    margin:0 0 18px;
  }

  /* módulos */
  .modules{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:14px;
    margin-bottom:44px;
  }
  .module-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:border-color .15s ease, transform .1s ease;
    cursor:pointer;
  }
  .module-card:hover{
    border-color:var(--accent);
  }
  .module-card .num{
    font-family:'Work Sans', sans-serif;
    font-size:12px;
    color:var(--accent);
  }
  .module-card .name{
    font-family:'Oswald', sans-serif;
    font-size:19px;
    font-weight:500;
  }
  .module-card .desc{
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.4;
  }

  /* stats */
  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width: 720px){
    .stats-grid{ grid-template-columns:1fr; }
  }

  .stat-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px;
  }
  .stat-card h3{
    margin:0 0 14px;
    font-family:'Oswald', sans-serif;
    font-size:15px;
    font-weight:500;
  }
  .stat-empty{
    color:var(--text-muted);
    font-size:13px;
  }

  .stock-row, .mov-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .stock-row:last-child, .mov-row:last-child{ border-bottom:none; }
  .stock-row .sku{ color:var(--text-muted); font-size:11.5px; }
  .stock-badge{
    font-size:12px;
    padding:2px 8px;
    border-radius:20px;
    background:rgba(217,119,87,0.15);
    color:var(--error);
    white-space:nowrap;
  }
  .mov-badge{
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    text-transform:capitalize;
    white-space:nowrap;
  }
  .mov-badge.ingreso{ background:rgba(127,174,134,0.15); color:var(--ok); }
  .mov-badge.despacho{ background:rgba(201,138,62,0.15); color:var(--accent); }
  .mov-badge.ajuste_positivo{ background:rgba(127,174,134,0.15); color:var(--ok); }
  .mov-badge.ajuste_negativo{ background:rgba(217,119,87,0.15); color:var(--error); }

  .loading{
    padding:60px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
  }
</style>
</head>
<body>

<div id="loading" class="loading">Cargando panel...</div>

<div id="app" style="display:none;">
  <header>
    <div class="brand">LB<span>·</span>ERP</div>
    <div class="empresa-chip">
      <div class="dot"></div>
      <div class="info">
        <div class="nombre" id="empresa-nombre">—</div>
        <div class="rol" id="empresa-rol">—</div>
      </div>
    </div>
    <div class="session-actions">
      <span id="user-email"></span>
      <button class="logout-btn" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <div class="section-title">MÓDULOS</div>
    <div class="modules" id="modules-grid">
      <!-- generado por JS -->
    </div>

    <div class="section-title">RESUMEN</div>
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Productos con stock bajo</h3>
        <div id="stock-bajo-list"><div class="stat-empty">Cargando...</div></div>
      </div>
      <div class="stat-card">
        <h3>Últimos movimientos de Kardex</h3>
        <div id="movimientos-list"><div class="stat-empty">Cargando...</div></div>
      </div>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL = "https://hjcheyewsrnnlyatidvt.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_iQzzt9-ekUisgQaEltnoFQ_VARuLsf4";

  const MODULOS = [
    { nombre: "Inventario",     desc: "Catálogo de productos" },
    { nombre: "Almacenamiento", desc: "Bodegas y ubicaciones" },
    { nombre: "Compras",        desc: "Órdenes de compra" },
    { nombre: "Ingresos",       desc: "Recepción de mercadería" },
    { nombre: "Despachos",      desc: "Salida de mercadería" },
    { nombre: "Kardex",         desc: "Historial de movimientos" },
    { nombre: "Guías internas", desc: "Documentos de traslado" }
  ];

  function initDashboard(){
    if (typeof window.supabase === 'undefined') {
      document.getElementById('loading').textContent =
        'No se pudo cargar la conexión con la base de datos. Desactiva el bloqueador de anuncios/extensión de privacidad para este sitio y recarga la página.';
      return;
    }

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let empresaActivaId = null;

    async function cargar(){
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById('user-email').textContent = session.user.email;

      // Empresa(s) del usuario. Si pertenece a más de una, por ahora
      // se usa la primera — más adelante se puede agregar un selector.
      const { data: relaciones, error: errRel } = await supabaseClient
        .from('usuarios_empresas')
        .select('rol, empresas ( id, nombre )')
        .eq('user_id', session.user.id);

      if (errRel || !relaciones || relaciones.length === 0) {
        document.getElementById('loading').textContent =
          'Tu usuario no está asociado a ninguna empresa todavía. Contacta a tu administrador.';
        return;
      }

      const activa = relaciones[0];
      empresaActivaId = activa.empresas.id;
      document.getElementById('empresa-nombre').textContent = activa.empresas.nombre;
      document.getElementById('empresa-rol').textContent = activa.rol;

      // Render módulos (por ahora apuntan a un placeholder común;
      // cada uno se reemplaza por su propia página cuando se construya)
      const grid = document.getElementById('modules-grid');
      grid.innerHTML = MODULOS.map((m, i) => `
        <div class="module-card" onclick="alert('Módulo ${m.nombre}: en construcción')">
          <div class="num">${String(i + 1).padStart(2, '0')}</div>
          <div class="name">${m.nombre}</div>
          <div class="desc">${m.desc}</div>
        </div>
      `).join('');

      // Stock bajo: productos donde el stock actual < stock_minimo
      const { data: productos } = await supabaseClient
        .from('productos')
        .select('id, sku, nombre, stock_minimo')
        .eq('empresa_id', empresaActivaId)
        .eq('activo', true);

      const { data: stocks } = await supabaseClient
        .from('stock_actual')
        .select('producto_id, stock')
        .eq('empresa_id', empresaActivaId);

      const stockPorProducto = {};
      (stocks || []).forEach(s => { stockPorProducto[s.producto_id] = s.stock; });

      const stockBajoList = document.getElementById('stock-bajo-list');
      const conStockBajo = (productos || []).filter(p => {
        const actual = stockPorProducto[p.id] || 0;
        return actual < (p.stock_minimo || 0);
      });

      if (conStockBajo.length === 0) {
        stockBajoList.innerHTML = '<div class="stat-empty">No hay productos con stock bajo el mínimo.</div>';
      } else {
        stockBajoList.innerHTML = conStockBajo.slice(0, 6).map(p => `
          <div class="stock-row">
            <div>
              <div>${p.nombre}</div>
              <div class="sku">${p.sku}</div>
            </div>
            <div class="stock-badge">${stockPorProducto[p.id] || 0} / mín. ${p.stock_minimo}</div>
          </div>
        `).join('');
      }

      // Últimos movimientos de Kardex
      const { data: movimientos } = await supabaseClient
        .from('kardex')
        .select('tipo_movimiento, cantidad, fecha, productos ( nombre )')
        .eq('empresa_id', empresaActivaId)
        .order('fecha', { ascending: false })
        .limit(6);

      const movList = document.getElementById('movimientos-list');
      if (!movimientos || movimientos.length === 0) {
        movList.innerHTML = '<div class="stat-empty">Todavía no hay movimientos registrados.</div>';
      } else {
        movList.innerHTML = movimientos.map(m => `
          <div class="mov-row">
            <div>${m.productos ? m.productos.nombre : '—'}</div>
            <span class="mov-badge ${m.tipo_movimiento}">${m.tipo_movimiento.replace('_', ' ')} · ${m.cantidad}</span>
          </div>
        `).join('');
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    });

    cargar();
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', initDashboard);
  } else {
    initDashboard();
  }
</script>

</body>
</html>
