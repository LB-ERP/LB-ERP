<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LB ERP · Guías internas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-deep:#10151c; --bg-panel:#171d26; --bg-card:#1b222c;
    --line:#2b3542; --accent:#c98a3e; --text-primary:#edeae3; --text-muted:#8b93a1;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100%; font-family:'Work Sans', sans-serif; color:var(--text-primary); background:var(--bg-deep); }
  a{ color:inherit; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--line); background:var(--bg-panel); flex-wrap:wrap; gap:12px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; font-family:'Oswald', sans-serif; font-weight:700; font-size:22px; }
  .brand span{ color:var(--accent); }
  .crumb{ font-size:13px; color:var(--text-muted); }
  .back-link{
    font-size:13px; color:var(--text-muted); border:1px solid var(--line);
    padding:8px 14px; border-radius:3px; text-decoration:none; transition:border-color .15s ease;
  }
  .back-link:hover{ border-color:var(--accent); }
  main{ max-width:900px; margin:0 auto; padding:60px 32px; text-align:center; }
  main h1{ font-family:'Oswald', sans-serif; font-size:26px; margin-bottom:10px; }
  main p{ color:var(--text-muted); font-size:14.5px; }
  .loading{ padding:60px; text-align:center; color:var(--text-muted); font-size:14px; }
</style>
</head>
<body>

<div id="loading" class="loading">Verificando sesión...</div>

<div id="app" style="display:none;">
  <header>
    <div class="brand">LB<span>·</span>ERP</div>
    <div class="crumb">Logística / Guías internas</div>
    <a class="back-link" href="../dashboard.html">← Volver al panel</a>
  </header>
  <main>
    <h1>Guías internas</h1>
    <p>Este módulo está en construcción. Aquí va a vivir la funcionalidad de los documentos de traslado.</p>
  </main>
</div>

<script>
  const SUPABASE_URL = "https://hjcheyewsrnnlyatidvt.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_iQzzt9-ekUisgQaEltnoFQ_VARuLsf4";

  function init(){
    if (typeof window.supabase === 'undefined') {
      document.getElementById('loading').textContent = 'No se pudo cargar la conexión. Desactiva bloqueadores de anuncios y recarga.';
      return;
    }
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (!session) {
        window.location.href = "../login.html";
        return;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    });
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>

</body>
</html>
